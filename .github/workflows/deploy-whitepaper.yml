name: Deploy whitepaper to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-whitepaper.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run docs:build
        env:
          VITE_RECOVERY_RPC_URL: ${{ vars.RECOVERY_RPC_URL }}
          VITE_RECOVERY_VAULT_ADDRESS: ${{ vars.RECOVERY_VAULT_ADDRESS }}
          VITE_JPYC_ADDRESS: ${{ vars.JPYC_ADDRESS }}
          VITE_TAMAGAKI_SBT_ADDRESS: ${{ vars.TAMAGAKI_SBT_ADDRESS }}
          VITE_RECOVERY_DEPLOYMENT_BLOCK: ${{ vars.RECOVERY_DEPLOYMENT_BLOCK }}
          VITE_JPYC_DECIMALS: ${{ vars.JPYC_DECIMALS }}
          VITE_MAINNET_RPC_URL: ${{ vars.MAINNET_RPC_URL }}
          VITE_MAINNET_VAULT_ADDRESS: ${{ vars.MAINNET_VAULT_ADDRESS }}
          VITE_MAINNET_JPYC_ADDRESS: ${{ vars.MAINNET_JPYC_ADDRESS }}
          VITE_MAINNET_DEPLOYMENT_BLOCK: ${{ vars.MAINNET_DEPLOYMENT_BLOCK }}
          VITE_MAINNET_JPYC_DECIMALS: ${{ vars.MAINNET_JPYC_DECIMALS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
